[project]
name = "openmath-visualised"
version = "0.1.0"
description = "Numerical probes and figures for results in the openai/math manuscript collection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "mpmath>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
